<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Janelle's Coffee Craft - Contact</title>
</head>
<body bgcolor="#f7f3ef" text="#333333" link="#4a2c2a" vlink="#4a2c2a" alink="#a0522d" align="center">

  <header>
    <h1>Janelle's Coffee Craft</h1>
    <nav>
      <a href="index.html">Home</a> |
      <a href="about.html">About</a> |
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <hr width="80%">

  <main>
    <h2>How to contact us!</h2>

    <p><b>Email:</b> support@janellescoffeecraft.com</p>
    <p><b>Phone:</b> +63 912 345 6789</p>
    <p><b>Address:</b> Sampaloc, Manila, Philippines</p>

    <br>

    <form action="contact.html" method="get">
      <table align="center" border="0">
        <tr>
          <td>
            <fieldset>
              <legend><b>Your details</b></legend>
              <br>

              <label for="user-name"><b>Name:</b></label><br>
              <input type="text" id="user-name" name="user-name" size="35" required>
              <br><br>

              <label for="user-email"><b>Email:</b></label><br>
              <input type="email" id="user-email" name="user-email" size="35" required>
              <br><br>

              <label for="subject"><b>Subject:</b></label><br>
              <select id="subject" name="subject">
                <option value="suggest-place">Suggest a Place</option>
                <option value="correct-detail">Correct a Detail</option>
                <option value="ask-question">Ask a Question</option>
                <option value="something-else">Something Else</option>
              </select>
              <br><br>

              <label for="message"><b>Message:</b></label><br>
              <textarea id="message" name="message" rows="5" cols="33" required></textarea>
              <br><br>

              <div align="center">
                <button type="submit">Send message</button>
              </div>
              <br>
            </fieldset>
          </td>
        </tr>
      </table>
    </form>
  </main>

  <br><hr width="80%">

  <footer>
    <p>&copy; 2026 Janelle's Coffee Craft. All rights reserved.</p>
  </footer>

</body>
</html>
